<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#14080A" />
    </linearGradient>
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E36" />
      <stop offset="100%" stop-color="#990011" />
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.15" stroke="#00E5FF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Web Arc Accents -->
  <path d="M 0,315 Q 600,-100 1200,315" fill="none" stroke="rgba(230,36,41,0.3)" stroke-width="2" />
  <path d="M 0,315 Q 600,730 1200,315" fill="none" stroke="rgba(0,229,255,0.25)" stroke-width="2" />

  <!-- Glowing Badge -->
  <rect x="80" y="80" width="260" height="42" rx="21" fill="rgba(255, 46, 54, 0.15)" stroke="#FF2E36" stroke-width="1.5" />
  <text x="210" y="107" fill="#FF5252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">DEVOPS &amp; CLOUD ENGINEER</text>

  <!-- Hero Titles -->
  <text x="80" y="210" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="1">SAM SUNIL</text>
  <text x="80" y="270" fill="url(#blue-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="3">PRODUCT ENGINEER // DEVOPS &amp; SRE</text>

  <!-- Description -->
  <text x="80" y="340" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Kubernetes • Multi-Cloud (AWS / GCP) • Terraform IaC • CI/CD GitOps Automation</text>
  <text x="80" y="375" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">"With great automation comes zero downtime!" 🕸️</text>

  <!-- Skill Pill Tags -->
  <g transform="translate(80, 430)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" />
    <text x="80" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">☸️ Kubernetes</text>
    <!-- Pill 2 -->
    <rect x="180" y="0" width="130" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" />
    <text x="245" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">🐳 Docker</text>
    <!-- Pill 3 -->
    <rect x="330" y="0" width="180" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" />
    <text x="420" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">☁️ AWS &amp; GCP</text>
    <!-- Pill 4 -->
    <rect x="530" y="0" width="160" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" />
    <text x="610" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">📦 Terraform</text>
    <!-- Pill 5 -->
    <rect x="710" y="0" width="170" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" />
    <text x="795" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">🚀 GitOps CI/CD</text>
  </g>

  <!-- Live URL Footer -->
  <text x="80" y="565" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">🌐 sam-sunil-4.github.io  |  GitHub: @sam-sunil-4</text>
</svg>
